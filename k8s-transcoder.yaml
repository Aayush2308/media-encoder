apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder-deployment
  labels:
    app: transcoder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transcoder
  template:
    metadata:
      labels:
        app: transcoder
    spec:
      containers:
      - name: transcoder
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: transcoder-service
  labels:
    app: transcoder
spec:
  type: NodePort
  selector:
    app: transcoder
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30097
